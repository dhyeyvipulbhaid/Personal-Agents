<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat — Personal Agents</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="shell-root"></div>
    <template id="page-body">
      <header class="page-head">
        <div>
          <h1 class="page-title">Chat</h1>
          <p class="lede">One local model on this machine. Chat is its own page.</p>
        </div>
      </header>
      <p class="model-status">
        <span id="ollama-dot" class="dot"></span>
        <span id="model-notice">Checking Ollama at 127.0.0.1:11434.</span>
      </p>
      <form id="models" class="model-row">
        <label>Chat model
          <select id="chat-model" name="chat">
            <option value="qwen3:4b">qwen3:4b</option>
          </select>
        </label>
        <label>Agent model
          <select id="agent-model" name="agent">
            <option value="qwen3:8b">qwen3:8b</option>
          </select>
        </label>
        <label>Builder model
          <select id="builder-model" name="builder">
            <option value="qwen2.5-coder:7b">qwen2.5-coder:7b</option>
          </select>
        </label>
        <button type="submit">Save models</button>
      </form>
      <p id="model-error" class="notice"></p>
      <div class="chat-layout">
        <aside>
          <button type="button" id="new-chat" class="ghost">New chat</button>
          <div id="sessions" class="session-list"></div>
        </aside>
        <section>
          <div id="thread" class="thread" aria-live="polite"></div>
          <form id="composer" class="composer">
            <textarea id="draft" name="text" placeholder="Message"></textarea>
            <div class="button-row">
              <button type="submit" id="send-button">Send</button>
            </div>
          </form>
        </section>
      </div>
    </template>
    <script src="shortcut.js"></script>
    <script src="shell.js"></script>
    <script src="markdown.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
