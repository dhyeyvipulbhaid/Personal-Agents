<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal Agents</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="shell-root"></div>
    <template id="page-body">
      <header class="page-head">
        <div>
          <h1 class="page-title">Home</h1>
          <p class="lede">Widgets, revenue, mail, and anything waiting on you.</p>
        </div>
        <div class="toolbar">
          <div class="segmented">
            <button type="button" id="layout-grid" aria-pressed="true">Grid</button>
            <button type="button" id="layout-list" aria-pressed="false">List</button>
          </div>
          <div class="segmented">
            <button type="button" id="density-comfortable" aria-pressed="true">
              Comfortable
            </button>
            <button type="button" id="density-compact" aria-pressed="false">
              Compact
            </button>
          </div>
        </div>
      </header>
      <p id="version">Version 0.0.0</p>
      <p id="host-version">Agent host …</p>
      <section id="widgets" class="cards grid comfortable" aria-label="Widgets"></section>
    </template>
    <script src="shortcut.js"></script>
    <script src="shell.js"></script>
    <script src="main.js"></script>
  </body>
</html>
