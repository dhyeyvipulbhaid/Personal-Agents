<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory — Personal Agents</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="shell-root"></div>
    <template id="page-body">
      <header class="page-head">
        <div>
          <h1 class="page-title">Memory</h1>
          <p class="lede">Facts saved on this machine after a chat reply, or from this page. Derived observations cite the facts they came from. Memory is encrypted by default. If the Keychain can't be used, set a passphrase or leave memory unencrypted. Nothing is deleted unless you confirm.</p>
        </div>
      </header>

      <section class="card">
        <h2>Graph</h2>
        <div class="button-row">
          <button type="button" id="graph-toggle" class="ghost">Pause</button>
          <button type="button" id="graph-refresh" class="ghost">Refresh</button>
        </div>
        <div id="edge-filters" class="button-row edge-filters"></div>
        <div id="graph-legend" class="graph-legend"></div>
        <p id="graph-status" class="notice"></p>
        <div class="graph-stage">
          <canvas id="memory-graph" width="800" height="480" aria-label="Memory graph"></canvas>
          <p id="graph-hover" class="graph-hover" hidden></p>
        </div>
        <article id="graph-detail" class="graph-detail" hidden></article>
      </section>

      <section class="card" id="memory-settings">
        <h2>Settings</h2>
        <form id="settings-form" class="stack">
          <label>Embedding model
            <input id="embedding-model" name="embeddingModel" value="nomic-embed-text" autocomplete="off" />
          </label>
          <label class="check-line">
            <input id="include-observations" name="includeObservations" type="checkbox" checked />
            Include derived observations in chat
          </label>
          <div class="button-row">
            <button type="submit">Save settings</button>
          </div>
          <label class="check-line">
            <input id="encrypt-memory" type="checkbox" checked />
            Encrypt memory at rest
          </label>
          <label class="check-line">
            <input id="use-passphrase" type="checkbox" />
            Use a passphrase instead of the Keychain
          </label>
          <div id="passphrase-row" hidden>
            <label>Passphrase
              <input id="memory-passphrase" type="password" autocomplete="new-password" />
            </label>
            <label>Confirm passphrase
              <input id="memory-passphrase-confirm" type="password" autocomplete="new-password" />
            </label>
            <button type="button" id="memory-passphrase-toggle" class="ghost">Show</button>
            <p id="memory-passphrase-error" class="notice"></p>
          </div>
          <p class="help">The Keychain is the default. A passphrase is stored only as a salt and a check, not as the key. Turning encryption on writes a fresh plaintext backup first. Turning it off restores that backup.</p>
          <p id="encryption-status" class="help"></p>
          <div class="button-row">
            <button type="button" id="retry-keychain" class="ghost" hidden>Retry</button>
            <button type="button" id="restore-backup" class="ghost" hidden>Restore from backup</button>
          </div>
        </form>
        <div id="encryption-choice" hidden>
          <p>The Keychain couldn't be used, so memory is still unencrypted. Set a passphrase to encrypt it, or keep it unencrypted for now. Nothing already saved is deleted.</p>
          <label>Passphrase
            <input id="choice-passphrase-input" type="password" autocomplete="new-password" />
          </label>
          <label>Confirm passphrase
            <input id="choice-passphrase-confirm" type="password" autocomplete="new-password" />
          </label>
          <button type="button" id="choice-passphrase-toggle" class="ghost">Show</button>
          <p id="choice-passphrase-error" class="notice"></p>
          <div class="button-row">
            <button type="button" id="choice-passphrase">Encrypt with passphrase</button>
            <button type="button" id="choice-stay-plain" class="ghost">Keep unencrypted</button>
          </div>
        </div>
        <div id="encryption-unlock" hidden>
          <p>Memory is locked. Enter the passphrase to unlock it.</p>
          <label>Passphrase
            <input id="unlock-passphrase-input" type="password" autocomplete="current-password" />
          </label>
          <button type="button" id="unlock-passphrase-toggle" class="ghost">Show</button>
          <p id="unlock-passphrase-error" class="notice"></p>
          <button type="button" id="unlock-passphrase">Unlock</button>
        </div>
      </section>

      <form id="remember" class="button-row">
        <label>Fact <input id="fact" name="text" /></label>
        <button type="submit">Save fact</button>
      </form>
      <p id="memory-status" class="notice"></p>

      <section class="card">
        <h2>Facts</h2>
        <form id="filters" class="button-row">
          <label>Search <input id="filter-query" name="query" /></label>
          <label>Entity <input id="filter-entity" name="entity" /></label>
          <label>Kind
            <select id="filter-kind" name="kind">
              <option value="">Any</option>
              <option value="world">World</option>
              <option value="experience">Experience</option>
            </select>
          </label>
          <button type="submit">Filter</button>
        </form>
        <ul id="facts" class="plain-list fact-list"></ul>
        <div class="button-row pager">
          <button type="button" id="prev-page" class="ghost">Previous</button>
          <span id="page-label" class="muted"></span>
          <button type="button" id="next-page" class="ghost">Next</button>
          <button type="button" id="delete-selected" class="danger">Delete selected</button>
        </div>
      </section>

      <section class="card">
        <h2>Derived observations</h2>
        <p class="help">Reflect reads this agent's facts and writes a few observations. Each one is marked derived and lists the facts it cites. Leave them out of chat from Settings.</p>
        <form id="reflect-form" class="button-row">
          <label>Topic <input id="reflect-query" name="query" placeholder="Optional" /></label>
          <button type="submit">Reflect now</button>
        </form>
        <p id="reflect-status" class="notice"></p>
        <ul id="observations" class="plain-list"></ul>
      </section>

      <section class="card">
        <h2>Sweep junk</h2>
        <p class="help">Preview assistant disclaimers, empty notes, and placeholders. Nothing is deleted until you confirm.</p>
        <div class="button-row">
          <button type="button" id="sweep-preview" class="ghost">Preview junk</button>
          <button type="button" id="sweep-apply" class="danger" hidden>Delete junk</button>
        </div>
        <ul id="sweep-list" class="plain-list"></ul>
      </section>
    </template>
    <script src="shortcut.js"></script>
    <script src="shell.js"></script>
    <script src="memory-graph.js"></script>
    <script src="memory.js"></script>
  </body>
</html>
