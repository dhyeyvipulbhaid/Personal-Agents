name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

  package:
    name: Package and install check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: apps/desktop
        run: bun run build

      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "apps/desktop/src-tauri/target/release/bundle/macos/Personal Agents.app" personal-agents-macos.zip

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: personal-agents-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: personal-agents-macos
          path: personal-agents-macos.zip
          if-no-files-found: error

      - name: Install check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.github\scripts\install-check-windows.ps1

      - name: Install check (macOS)
        if: runner.os == 'macOS'
        run: bash .github/scripts/install-check-macos.sh "$GITHUB_WORKSPACE/personal-agents-macos.zip"

  # Empty slot. Later milestones add the UI flow steps to this job.
  e2e:
    name: End-to-end UI flows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Placeholder
        run: echo "No end-to-end UI flow tests yet. This job is reserved for them."
